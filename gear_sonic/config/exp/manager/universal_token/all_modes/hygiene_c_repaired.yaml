# @package _global_
# HYGIENE MATRIX — arm C: repaired bank, release sampler.
#
# FACTOR THAT DIFFERS FROM hygiene_a_raw: the bank. The clip COUNT is the same
# as arm A — every clip survives; the unsupportable ones have had their root
# trajectory projected back onto the contacts they claim. Sampler, num_envs,
# iterations, seed handling and callbacks are inherited unchanged from arm A.
#
# CONTRAST IDENTIFIED: A vs C = does fixing the reference beat leaving it alone,
# at matched clip count and matched compute? And B vs C = at matched compute, is
# it better to delete an unsupportable clip or to repair it? Because C holds the
# clip count fixed, it is the arm that separates "the bad clips were removed"
# from "the survivors got more exposure" in arm B.

defaults:
  - /exp/manager/universal_token/all_modes/hygiene_a_raw
  - _self_

exp_var: c_repaired

manager_env:
  commands:
    motion:
      motion_lib_cfg:
        # PLACEHOLDER PATH — this bank does not exist yet.
        # Produced by scripts/research/hygiene_repair_bank.py, which applies
        # gear_sonic/research/hygiene/repair.py (contact projection of the root)
        # to every clip in the raw bank and writes the result here. Clips the
        # repair budget cannot fix are written through unchanged, so the key set
        # is identical to the raw bank's.
        motion_file: data/motion_lib_hygiene/repaired/robot_filtered

        # PLACEHOLDER PATH — and the one real risk in this arm.
        # Repair moves root_trans_offset by up to RepairBudget.max_offset_m
        # (0.15 m). The SMPL bank is a SEPARATE set of pkl files, and when a
        # matching file exists its smpl_joints OVERWRITE the robot pkl's own
        # (motion_lib_base.py:1944-1946). So a repaired robot bank paired with
        # the raw SMPL bank conditions the SMPL encoder on a reference that
        # disagrees with the tracking target it is being asked to hit, by
        # exactly the repair offset — and only in this arm. That is a confound
        # manufactured by the config, not by the treatment.
        # REQUIRED: hygiene_repair_bank.py must emit a SMPL bank shifted by the
        # same per-frame offset, at this path.
        # FALLBACK, if it does not: set this key back to the arm-A value
        # (data/bones_seed_smpl) so all five arms share one SMPL bank, and
        # record the offset mismatch as a stated limit of arm C. Do NOT leave a
        # repaired robot bank pointing at a path that silently does not exist —
        # a missing directory resolves to all-None SMPL data
        # (motion_lib_base.py:291-292), which would remove SMPL conditioning
        # from this arm entirely and confound it far worse.
        smpl_motion_file: data/motion_lib_hygiene/repaired/smpl

hygiene_matrix:
  arm: c_repaired
  factor: bank_repaired
  bank: repaired
  bank_is_placeholder: true
  sampler: release_default
