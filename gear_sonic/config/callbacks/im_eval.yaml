im_eval:
  _target_: gear_sonic.trl.callbacks.im_eval_callback.ImEvalCallback
  eval_frequency: 1
  eval_only: true
  output_dir: ${experiment_dir}/eval_metrics
  # Optional step cap for fast smoke tests. Leave null for full-sequence metrics.
  max_eval_steps: null
  # Default-off diagnostic. A positive value records exact per-motion root XY errors.
  root_xy_diagnostic_threshold_m: null
